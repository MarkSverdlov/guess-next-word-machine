[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "guess-next-word-machine"
version = "1.0.0"
dependencies = ["matplotlib", "numpy", "torch", "pandas", "scikit-learn"]

[project.scripts]
chart-statistics = "guesser.preprocess:chart_statistics_entrypoint"
train-model = "guesser.train:train_entrypoint"
guess-next-word = "guesser.infer:infer_entrypoint"

[tool.tox]
requires = ["tox>=4.19"]

[tool.tox.env_run_base]
deps = ["pytest"]
description = "Run unit tests"
commands = [["pytest", { replace="posargs", default=["tests"], extend=true }]]
